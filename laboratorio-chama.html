<p id="info"></p>
<div class="grade">
  <button id="bf">Bola de fogo</button>
  <button id="br">Mike ataca Chama</button>
  <button id="bt">Passar turno</button>
  <button id="bz" class="sec">Reiniciar</button>
</div>

<script src="js/penxy/chama-fogo.js"></script>
<script>
const chama = document.getElementById('chama'), mike = document.getElementById('mike'), info = document.getElementById('info');
const botoes = document.querySelectorAll('button');
const PONTO = { x: 0.72, y: 0.42 };   // saída do fogo na carta do Chama
let vida = 200, queima = null, trava = false;   // queima = { dano, turnos }

function atualizar() {
  info.textContent = 'Mike ' + vida + '/200' + (queima ? '  ·  queimando ' + queima.dano + ' × ' + queima.turnos : '');
}
function bloquear(sim) { trava = sim; botoes.forEach(b => b.disabled = sim); }
atualizar();

document.getElementById('bf').onclick = async () => {   // Chama ataca: Fire Ball, 50 × 6
  if (trava) return; bloquear(true);
  await Efeitos.bolaDeFogo(chama, mike, { ponto: PONTO, mira: { x: 0.5, y: 0.42 }, queimar: 6, onImpacto: () => { queima = { dano: 50, turnos: 6 }; atualizar(); } });
  bloquear(false);
};
document.getElementById('br').onclick = async () => {   // Mike ataca Chama: Esquentadinho revida, 35 × 3
  if (trava) return; bloquear(true);
  const a = chama.getBoundingClientRect(), b = mike.getBoundingClientRect(), d = -(b.left - a.right + b.width * 0.12);
  try { mike.animate([{ translate: '0 0' }, { translate: d + 'px 0', offset: 0.3 }, { translate: d + 'px 0', offset: 0.5 }, { translate: '0 0' }], { duration: 420, easing: 'ease-out' }); } catch (e) {}
  await new Promise(r => setTimeout(r, 130));
  try { chama.animate([{ translate: '0 0', filter: 'brightness(1.9)' }, { translate: '-6px 0', filter: 'brightness(1.4)', offset: 0.4 }, { translate: '0 0', filter: 'brightness(1)' }], { duration: 240 }); } catch (e) {}
  await new Promise(r => setTimeout(r, 100));
  await Efeitos.bolaDeFogo(chama, mike, { tipo: 'revide', ponto: PONTO, mira: { x: 0.5, y: 0.42 }, onImpacto: () => { queima = { dano: 35, turnos: 3 }; atualizar(); } });
  bloquear(false);
};
document.getElementById('bt').onclick = async () => {   // passa um turno: o fogo causa dano
  if (trava || !queima) return; bloquear(true);
  vida = Math.max(0, vida - queima.dano); queima.turnos--;
  const ainda = await Efeitos.queimar.tick(mike, { dano: queima.dano });
  if (!ainda) queima = null;
  atualizar(); bloquear(false);
};
document.getElementById('bz').onclick = () => { Efeitos.queimar.apagar(mike); vida = 200; queima = null; atualizar(); };
</script>
